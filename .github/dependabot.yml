version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Python dependencies across the repository and services.
  # Group the same dependency across directories so shared dependencies
  # are updated together rather than producing one PR per service.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/services/orchestrator"
      - "/services/worker"
      - "/services/research_agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      shared-dependencies:
        patterns:
          - "*"
        group-by: dependency-name

  # Docker base images (orchestrator service)
  - package-ecosystem: "docker"
    directory: "/services/orchestrator"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Docker base images (worker service)
  - package-ecosystem: "docker"
    directory: "/services/worker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Docker base images (research agent service)
  - package-ecosystem: "docker"
    directory: "/services/research_agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

