version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Python dependencies (root development and test requirements)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Python dependencies (orchestrator service)
  - package-ecosystem: "pip"
    directory: "/services/orchestrator"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Python dependencies (worker service)
  - package-ecosystem: "pip"
    directory: "/services/worker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Python dependencies (research agent service)
  - package-ecosystem: "pip"
    directory: "/services/research_agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Docker base images (orchestrator service)
  - package-ecosystem: "docker"
    directory: "/services/orchestrator"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Docker base images (worker service)
  - package-ecosystem: "docker"
    directory: "/services/worker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Docker base images (research agent service)
  - package-ecosystem: "docker"
    directory: "/services/research_agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

