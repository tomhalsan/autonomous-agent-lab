name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run test suite
        run: pytest -q -m "not redis and not external_provider"

      - name: Run real Redis integration tests
        env:
          REDIS_URL: redis://localhost:6379/15
        run: pytest -q -m redis

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate container image packaging
        run: |
          docker build -f services/orchestrator/Dockerfile -t test-orchestrator .
          docker run --rm test-orchestrator python -c "import orchestrator.presentation.api"
          docker build -f services/worker/Dockerfile -t test-worker .
          docker run --rm test-worker python -c "import agent_policy, worker.main"
          docker build -f services/research_agent/Dockerfile -t test-research-agent .
          docker run --rm test-research-agent python -c "import agent_policy, research_agent.main"
