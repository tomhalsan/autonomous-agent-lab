<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autonomous Agent Lab</title><style>body{font-family:system-ui;margin:0;background:#0b1220;color:#e5e7eb}.wrap{max-width:1000px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#111a2e;border:1px solid #26324b;border-radius:16px;padding:20px}h1{margin-top:0}input{width:75%;padding:12px;border-radius:10px;border:1px solid #44506a;background:#0b1220;color:white}button{padding:12px 18px;border:0;border-radius:10px;background:#4f8cff;color:white}.row{padding:10px 0;border-bottom:1px solid #26324b}.ok{color:#55d6a6}@media(max-width:700px){.grid{grid-template-columns:1fr}input{width:65%}}</style></head><body><main class="wrap"><h1>Autonomous Agent Lab</h1><p>Containerized agent state and event monitor</p><section class="card"><form id="task"><input id="prompt" placeholder="Give worker-1 a small task" required><button>Submit</button></form><p id="result"></p></section><div class="grid"><section class="card"><h2>Agents</h2><div id="agents">Loading...</div></section><section class="card"><h2>Recent events</h2><div id="events">Loading...</div></section></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function refresh(){const [a,e]=await Promise.all([fetch('/api/agents').then(r=>r.json()),fetch('/api/events').then(r=>r.json())]);agents.innerHTML=a.length?a.map(x=>`<div class="row"><b>${esc(x.agent_id)}</b>${Array.isArray(x.capabilities)&&x.capabilities.length?' ['+esc(x.capabilities.join(', '))+']':''} <span class="ok">${esc(x.state)}</span><br>${esc(x.detail)}</div>`).join(''):'No agents yet';events.innerHTML=e.length?e.map(x=>`<div class="row"><b>${esc(x.state)}</b> ${esc(x.agent_id)}<br>${esc(x.detail)}</div>`).join(''):'No events yet'};const taskForm=document.getElementById('task');const promptInput=document.getElementById('prompt');taskForm.onsubmit=async ev=>{ev.preventDefault();const r=await fetch('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:promptInput.value})});result.textContent=JSON.stringify(await r.json());promptInput.value='';refresh()};refresh();setInterval(refresh,2000);</script></body></html>
