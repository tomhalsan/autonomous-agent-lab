[project]
name = "autonomous-agent-lab"
version = "0.4.0"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"

[tool.pytest.ini_options]
pythonpath = ["services/orchestrator/src", "services/worker/src", "services/research_agent/src", "packages/contracts/src", "packages/infrastructure/src", "packages/policy/src"]
testpaths = ["tests"]
markers = [
    "redis: integration tests requiring an explicit live Redis instance via REDIS_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyrefly]
search-path = [
    "services/orchestrator/src",
    "services/worker/src",
    "services/research_agent/src",
    "packages/contracts/src",
    "packages/infrastructure/src",
    "packages/policy/src",
]
